plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.fengyin.activator'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.fengyin.activator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        ownerRelease {
            if (System.getenv('FY_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('FY_ANDROID_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('FY_ANDROID_SIGNING_PASSWORD')
                keyAlias 'fengyin-activator'
                keyPassword System.getenv('FY_ANDROID_SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.ownerRelease
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
