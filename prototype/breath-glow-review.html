<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风吟 · 精简模式呼吸光预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060b13;color:#e9f1fa;font:14px system-ui,sans-serif}button,select,input{font:inherit}button,select{color:inherit;background:#172433;border:1px solid #ffffff14;border-radius:9px;padding:9px 12px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #72dfec;outline-offset:3px}.review{max-width:940px;margin:auto;padding:28px 32px}.review h1{font-size:19px;margin:0 0 8px}.hint{color:#91a5ba;font-size:13px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 32px}.controls output{font-variant-numeric:tabular-nums;min-width:42px}.controls input{width:150px;accent-color:#6edbe6}.stage{padding:28px 30px 40px}.window{--a:85,210,238;--b:135,113,235;--energy:.5;max-width:700px;margin:auto;background:#0b1725;border-radius:23px;position:relative;isolation:isolate;padding:23px;box-shadow:0 20px 60px #0008}.window:before{content:"";position:absolute;inset:-9px;z-index:-1;border-radius:32px;box-shadow:0 0 42px 8px rgba(var(--a),.42),0 0 78px 12px rgba(var(--b),.23);opacity:calc(var(--energy)*.9);pointer-events:none}.wash{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:3}.wash:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 0% 40%,rgba(var(--a),.40),transparent 36%),radial-gradient(ellipse at 100% 65%,rgba(var(--b),.34),transparent 36%),linear-gradient(0deg,rgba(var(--a),.17),transparent 20%,transparent 80%,rgba(var(--a),.14));opacity:var(--energy)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}header b{color:rgb(var(--a));font-size:17px}header small{display:block;color:#9eb0c2;font-size:11px;margin-top:5px}.layout{display:grid;grid-template-columns:.95fr 1.25fr;gap:18px}.tones h2{font-size:13px;color:#92a9bd;margin:0 0 12px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiles button{font-size:12px;text-align:left;min-height:45px;padding:10px 8px;background:#152739;border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiles button.active{background:rgba(var(--a),.20);color:rgb(var(--a));box-shadow:inset 3px 0 rgb(var(--a))}.instrument{background:#101f2f;border-radius:18px;padding:18px}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.heading small{color:#8fa4b8}.heading h2{font-size:20px;margin:5px 0}.heading button{font-size:11px;padding:7px}.art{height:320px;position:relative;display:grid;place-items:center}.art img{height:88%;max-width:85%;object-fit:contain;position:relative;z-index:2}.ring{position:absolute;width:180px;height:180px;border:1px solid rgba(var(--a),.55);border-radius:50%;box-shadow:0 0 22px rgba(var(--a),.17);opacity:calc(.16 + var(--energy)*.65);transform:scale(calc(.90 + var(--energy)*.20))}.ring.second{width:225px;height:225px;border-color:rgba(var(--b),.4);transform:scale(calc(.92 + var(--energy)*.24))}.bottom{margin-top:14px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.actions button{font-size:11px;padding:10px 3px;white-space:nowrap}.bottom label{display:flex;align-items:center;gap:10px;color:#a2b4c7;font-size:12px;margin-top:15px}.bottom input{min-width:0;width:100%;accent-color:rgb(var(--a))}.bottom select{width:100%;margin-top:15px;background:#172738;color:#deebf8}.level{height:3px;background:#253548;border-radius:4px;margin-top:14px}.level i{display:block;height:100%;width:calc(var(--energy)*100%);background:rgb(var(--a));border-radius:4px}.tag{font-size:11px;color:#8298ad;text-align:center;margin-top:26px}@media(max-width:600px){.review{padding:18px 12px}.stage{padding:20px 8px}.window{padding:14px}.layout{gap:10px;grid-template-columns:.9fr 1.1fr}.instrument{padding:10px}.art{height:240px}.ring{width:110px;height:110px}.ring.second{width:145px;height:145px}.tiles{grid-template-columns:1fr}.tiles button:nth-child(n+9){display:none}.actions{grid-template-columns:1fr 1fr}.heading{flex-wrap:wrap}header small{max-width:240px}.controls input{width:110px}}
</style>
<div class="review"><h1>精简模式 · 柔和呼吸光</h1><div class="hint">预览示意，不连接音源。光晕随气息整体明暗变化，不旋转、不跑马。</div>
<div class="controls"><button id="auto" aria-pressed="true">暂停自动吹奏</button><button data-energy="0">停吹</button><button data-energy="25">弱吹</button><button data-energy="90">强吹</button><label for="breath">气息</label><input id="breath" type="range" min="0" max="100" value="50"><output id="value">50%</output></div>
<div class="stage"><section class="window" id="window"><div class="wash"></div><header><div><b>风吟 · 精简模式</b><small>更好用的智能软音源平台 · 公众号：风吟软音源</small></div><span>预览</span></header><div class="layout"><aside class="tones"><h2>音色方案</h2><div class="tiles" id="tiles"></div></aside><div><section class="instrument"><div class="heading"><div><small>当前音色</small><h2 id="tone">中萨-爵士</h2></div><button>演奏技巧</button></div><div class="art"><div class="ring"></div><div class="ring second"></div><img src="../assets/instruments/instrument_alto_sax.png" alt="中音萨克斯"></div><div class="level"><i></i></div></section><section class="bottom"><div class="actions"><button>开始录音</button><button>我的录音</button><button>演奏调：C</button><button>弯音：±2</button></div><label>混响<input type="range" value="18" aria-label="混响"></label><label>音量<input type="range" value="75" aria-label="音量"></label><select id="theme" aria-label="主题"><option>霓虹舞台</option><option>春生</option><option>夏荷</option><option>秋韵</option><option>冬雪</option><option>中国红</option><option>流金</option><option>极简</option></select></section></div></div></section></div><div class="tag">自动演示：起吹 → 渐强 → 停吹淡出 · 也可拖动气息滑块比较</div></div>
<script>
const win=document.getElementById('window'),slider=document.getElementById('breath'),value=document.getElementById('value'),auto=document.getElementById('auto');let running=!matchMedia('(prefers-reduced-motion: reduce)').matches,target=.5,energy=.5,last=performance.now(),phase=0;
function setAuto(on){running=on;auto.textContent=on?'暂停自动吹奏':'自动吹奏';auto.setAttribute('aria-pressed',String(on));}setAuto(running);
auto.onclick=()=>setAuto(!running);slider.oninput=()=>{setAuto(false);target=+slider.value/100;};document.querySelectorAll('[data-energy]').forEach(b=>b.onclick=()=>{setAuto(false);target=+b.dataset.energy/100;slider.value=b.dataset.energy;});
const colors=[['85,210,238','135,113,235'],['104,231,172','216,221,101'],['101,224,210','255,125,183'],['231,170,94','111,158,184'],['183,236,255','130,159,255'],['255,75,82','242,195,91'],['255,200,90','231,110,50'],['117,169,220','139,152,168']];document.getElementById('theme').onchange=e=>{const c=colors[e.target.selectedIndex];win.style.setProperty('--a',c[0]);win.style.setProperty('--b',c[1]);};
const names=['高萨-肯尼基','高萨-流行','中萨-爵士','中萨-深情','中萨-流行','次中萨-醇厚','次中萨-温暖','次中萨-气包音','上低萨-爵士','上低萨-流行','小号','长笛','二胡','古筝','葫芦丝','唢呐'];const tiles=document.getElementById('tiles');names.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.classList.toggle('active',n==='中萨-爵士');b.onclick=()=>{tiles.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tone').textContent=n;};tiles.appendChild(b);});
function frame(now){const dt=Math.min((now-last)/1000,.1);last=now;if(running){phase=(phase+dt)%8;target=phase<5?Math.pow(Math.sin(phase/5*Math.PI),.75)*.95:0;slider.value=Math.round(target*100);}energy+=(target-energy)*(1-Math.exp(-dt/(target>energy?.18:.65)));win.style.setProperty('--energy',energy.toFixed(4));value.textContent=Math.round(target*100)+'%';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
