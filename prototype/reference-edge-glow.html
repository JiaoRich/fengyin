<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>风吟 · 视频参考边缘光效</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#edf3ff;font:14px system-ui,sans-serif}header{max-width:1040px;margin:28px auto 0;padding:0 28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}header span{color:#9ba6bc;font-size:12px}.controls{display:flex;align-items:center;gap:9px;margin-left:auto}button{border:1px solid #ffffff20;border-radius:9px;background:#171b25;color:#dbe7ff;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{border-color:#a8c4ff;background:#25304b}input{accent-color:#97acff;width:100px}output{font-variant-numeric:tabular-nums;width:4ch}.stage{position:relative;margin:10px auto;width:min(810px,100vw);height:calc(100vh - 110px);min-height:640px;max-height:880px}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.window{position:absolute;inset:58px;border-radius:28px;background:linear-gradient(135deg,#0c1521,#080e18 60%,#121225);overflow:hidden;padding:22px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;justify-content:space-between;align-items:center;color:#b8d8ef;font-size:14px}.brand small{color:#718096}.layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:15px;min-height:0;flex:1}.tones{display:flex;flex-direction:column;min-height:0}.tones h2{font-size:12px;color:#7e90a6;font-weight:500;margin:3px 0 14px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px;overflow:auto;scrollbar-width:thin;scrollbar-color:#31405a transparent;align-content:start}.tiles button{font-size:12px;text-align:left;padding:14px 9px;background:#15253b;border:0}.tiles button.active{background:#20344a;color:#8edbf6;box-shadow:inset 2px 0 #8edbf6}.performance{min-height:0;display:flex;flex-direction:column;gap:12px}.instrument{border:1px solid #ffffff0c;border-radius:19px;background:#ffffff02;display:flex;flex-direction:column;padding:17px;min-height:0;flex:1}.heading{display:flex;justify-content:space-between;align-items:center}.heading small{font-size:11px;color:#8393a9}.heading h2{margin:7px 0;font-size:18px}.heading button{padding:6px;font-size:10px;color:#a1c0d5;background:#182535;border:0}.art{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}.art img{max-height:100%;max-width:85%;object-fit:contain}.meter{font-size:11px;color:#8699b3;display:flex;justify-content:space-between}.track{height:5px;margin-top:10px;background:#ffffff0b;border-radius:8px;overflow:hidden}.track i{display:block;width:0;height:100%;background:linear-gradient(90deg,#6acfff,#b99dff)}.bottom{border:1px solid #ffffff0c;border-radius:16px;background:#111c2a;padding:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{font-size:11px;background:#1b2d42;border:0;padding:10px 5px}.setting{display:grid;grid-template-columns:40px 1fr 30px;align-items:center;gap:8px;margin-top:14px;font-size:11px;color:#8d9bb0}.setting .line{height:4px;border-radius:4px;background:linear-gradient(90deg,#749bcc 65%,#28374a 65%)}footer{text-align:center;color:#7f8aa0;font-size:12px;padding:0 16px 20px}@media(max-width:650px){.window{inset:40px;padding:15px}.stage{min-height:640px}.layout{grid-template-columns:.8fr 1.2fr;gap:10px}.tiles{grid-template-columns:1fr}.heading h2{font-size:15px}.brand small{display:none}}
.stage{width:min(810px,max(520px,calc((100vh - 226px)*.76 + 116px)),100vw)}
</style>
<header><h1>视频参考 · 边缘光效</h1><span>七彩流转 / 新版100%＝旧版35%光效</span><div class="controls"><button data-level="0" aria-pressed="false">停吹</button><button data-level=".25" aria-pressed="false">弱吹</button><button data-level="1" aria-pressed="true">强吹</button><input id="breath" aria-label="模拟气息" type="range" min="0" max="100" value="100"><output id="value">100%</output></div></header>
<div class="stage"><canvas id="glow"></canvas><section class="window"><div class="brand"><b>风吟 · 精简模式</b><small>效果示意，不连接音源</small><span>—　×</span></div><div class="layout"><aside class="tones"><h2>音色方案</h2><div class="tiles" id="tiles"></div></aside><div class="performance"><section class="instrument"><div class="heading"><div><small>当前音色</small><h2>中音萨克斯 · 爵士</h2></div><button>演奏技巧</button></div><div class="art"><img src="../assets/instruments/instrument_alto_sax.png" alt="中音萨克斯"></div><div class="meter"><span>气息强度</span><b id="meter">85%</b></div><div class="track"><i id="fill"></i></div></section><section class="bottom"><div class="actions"><button>开始录音</button><button>我的录音</button><button>演奏调：C调</button><button>弯音：±1</button></div><div class="setting"><span>混响</span><i class="line"></i><span>32%</span></div><div class="setting"><span>主音量</span><i class="line"></i><span>78%</span></div></section></div></div></section></div>
<footer>本页只验证视频所示光效。正式窗口需要独立的透明外侧光晕层，不能用内部粗边替代。</footer>
<script>
const canvas=document.querySelector('#glow'),ctx=canvas.getContext('2d'),win=document.querySelector('.window'),slider=document.querySelector('#breath');
let target=1,energy=1,last=performance.now(),phase=0;
// Keep the old 35% rendering exactly as the new maximum; MIDI readout stays 0–100%.
const maxGlowEnergy=.35, colourCycleSeconds=4;
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const names=['高萨-肯尼基','高萨-流行','中萨-爵士','中萨-深情','次中萨-醇厚','次中萨-温暖','长笛','双簧管','二胡','古筝','葫芦丝','柳琴','马头琴','曲笛','埙','唢呐'];document.querySelector('#tiles').innerHTML=names.map(n=>`<button class="${n==='中萨-爵士'?'active':''}">${n}</button>`).join('');
function setLevel(v){target=v;slider.value=Math.round(v*100);document.querySelector('#value').textContent=Math.round(v*100)+'%';document.querySelector('#meter').textContent=Math.round(v*100)+'%';document.querySelector('#fill').style.width=v*100+'%';document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.level===v)));}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.level));slider.oninput=()=>setLevel(+slider.value/100);setLevel(1);
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.1);if(dt<1/32)return;last=now;energy+=(target-energy)*(1-Math.exp(-dt/(target>energy?.12:.32)));if(!reduced)phase=(phase+dt*Math.PI*2/colourCycleSeconds)%(Math.PI*2);
const glowEnergy=energy*maxGlowEnergy;
const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
const x=win.offsetLeft,y=win.offsetTop,ww=win.offsetWidth,hh=win.offsetHeight,r=28;
const gradient=ctx.createConicGradient(phase,w/2,h/2);['#00eaff','#3654ff','#e33dff','#ff613a','#ffe438','#00f2a6','#00eaff'].forEach((c,i)=>gradient.addColorStop(i/6,c));ctx.strokeStyle=gradient;
// Render the halo BEFORE the opaque window, so no glow spills over its contents.
for(const [blur,width,alpha] of [[30,22,.85],[14,9,.95],[4,3,1],[0,1.4,1]]){ctx.save();ctx.globalAlpha=Math.min(1,.025+Math.pow(glowEnergy,.7)*alpha);ctx.filter=blur?`blur(${blur*(.65+.35*glowEnergy)}px)`:'none';ctx.lineWidth=width;ctx.beginPath();ctx.roundRect(x-.6,y-.6,ww+1.2,hh+1.2,r+.6);ctx.stroke();ctx.restore();}
}requestAnimationFrame(frame);
</script></html>
