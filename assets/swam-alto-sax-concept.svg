<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-labelledby="title desc">
  <title id="title">金色高音萨克斯</title>
  <desc id="desc">以金属渐变、按键和弯曲管身绘制的萨克斯乐器插画</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b430d"/>
      <stop offset=".22" stop-color="#ffd873"/>
      <stop offset=".47" stop-color="#b66b16"/>
      <stop offset=".7" stop-color="#fff0a4"/>
      <stop offset="1" stop-color="#8a4b0c"/>
    </linearGradient>
    <linearGradient id="darkGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#603008"/>
      <stop offset=".48" stop-color="#efb94c"/>
      <stop offset="1" stop-color="#7d420c"/>
    </linearGradient>
    <radialGradient id="bell" cx="43%" cy="35%" r="65%">
      <stop offset="0" stop-color="#2a1405"/>
      <stop offset=".5" stop-color="#7f430d"/>
      <stop offset=".77" stop-color="#f2b849"/>
      <stop offset="1" stop-color="#fff0a1"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-30%" width="200%" height="190%">
