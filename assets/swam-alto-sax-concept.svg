    <g fill="#fff2ad">
      <circle cx="83" cy="119" r="4"/><circle cx="71" cy="150" r="4"/><circle cx="80" cy="181" r="4"/>
      <circle cx="152" cy="193" r="4"/><circle cx="161" cy="223" r="4"/>
