    <path d="M149 57c-15 39-24 74-20 107 5 41 24 73 19 112" fill="none" stroke="#fff0a1" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
    <path d="M143 275c25 5 41 18 48 41-24 24-60 30-91 10 3-24 18-43 43-51z" fill="url(#gold)" stroke="#ffe68b" stroke-width="2"/>
    <ellipse cx="145" cy="320" rx="48" ry="25" fill="url(#bell)" stroke="#ffe794" stroke-width="4"/>
    <ellipse cx="145" cy="319" rx="29" ry="13" fill="#2c1505" opacity=".72"/>
