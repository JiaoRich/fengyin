name: 风吟虚拟音频驱动编译验证

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fengyin-audio-engine-1.1.0
    paths:
      - "audio-driver/**"
      - "scripts/prepare-fengyin-audio-driver.ps1"
      - ".github/workflows/audio-driver-build.yml"

permissions:
  contents: read

jobs:
  build-driver:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: 获取风吟源码
        uses: actions/checkout@v4

      - name: 准备固定版本 SysVAD
        shell: pwsh
        run: ./scripts/prepare-fengyin-audio-driver.ps1 -OutputDirectory "$env:RUNNER_TEMP/fengyin-driver-source"

      - name: 恢复微软 WDK NuGet 工具链
        shell: pwsh
        run: nuget restore "$env:RUNNER_TEMP/fengyin-driver-source/packages.config" -PackagesDirectory "$env:RUNNER_TEMP/fengyin-driver-source/packages"

      - name: 编译 x64 Release 驱动
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "未找到 Visual Studio Installer 的 vswhere.exe"
          }

          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild/**/Bin/MSBuild.exe | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw "未找到可用的 MSBuild.exe"
          }

          # The GitHub image contains the kernel MSBuild toolset, while the
          # pinned WDK package supplies host tools such as stampinf.exe. NuGet
          # does not add that private tools folder to PATH for packages.config
          # projects, so resolve it explicitly instead of relying on runner
          # image-specific global WDK installation state.
          $stampInf = Get-ChildItem "$env:RUNNER_TEMP/fengyin-driver-source/packages" `
            -Filter stampinf.exe -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]stampinf\.exe$' } |
            Select-Object -First 1
          if (-not $stampInf) {
            throw "WDK NuGet 包中未找到 x64/stampinf.exe"
          }
          $env:PATH = "$($stampInf.Directory.FullName);$env:PATH"

          $infVerif = Get-ChildItem "$env:RUNNER_TEMP/fengyin-driver-source/packages" `
            -Filter infverif.dll -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]infverif\.dll$' } |
            Select-Object -First 1
          if (-not $infVerif) {
            throw "WDK NuGet 包中未找到 x64/infverif.dll"
          }
          $env:PATH = "$($infVerif.Directory.FullName);$env:PATH"

          & $msbuild "$env:RUNNER_TEMP/fengyin-driver-source/audio/sysvad/EndpointsCommon/EndpointsCommon.vcxproj" `
            -restore `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:TreatWarningAsError=false `
            -m
          if ($LASTEXITCODE -ne 0) {
            throw "EndpointsCommon 编译失败：$LASTEXITCODE"
          }

          & $msbuild "$env:RUNNER_TEMP/fengyin-driver-source/audio/sysvad/TabletAudioSample/TabletAudioSample.vcxproj" `
            -restore `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:TreatWarningAsError=false `
            -p:SkipPackageVerification=true `
            -p:RunApiValidator=false `
            -m
          if ($LASTEXITCODE -ne 0) {
            throw "风吟虚拟音频驱动编译失败：$LASTEXITCODE"
          }

      - name: 上传内部编译产物
        uses: actions/upload-artifact@v4
        with:
          name: fengyin-audio-driver-unsigned-internal
          path: |
            ${{ runner.temp }}/fengyin-driver-source/audio/sysvad/**/x64/Release/**
            ${{ runner.temp }}/fengyin-driver-source/audio/sysvad/**/Release/**
          if-no-files-found: error
