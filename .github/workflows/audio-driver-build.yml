name: 风吟虚拟音频驱动编译验证

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fengyin-audio-engine-1.1.0
    paths:
      - "audio-driver/**"
      - "scripts/prepare-fengyin-audio-driver.ps1"
      - "scripts/prepare-driver-submission.ps1"
      - "scripts/import-signed-driver.ps1"
      - "scripts/test-fengyin-production-driver.ps1"
      - "scripts/test-fengyin-test-driver.ps1"
      - "scripts/package-audio-engine-test-kit.ps1"
      - "scripts/audio-test-kit/**"
      - "docs/风吟音频引擎免费实机测试说明.md"
      - ".github/workflows/audio-driver-build.yml"

permissions:
  contents: read

jobs:
  build-driver:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: 获取风吟源码
        uses: actions/checkout@v4

      - name: 准备固定版本 SysVAD
        shell: pwsh
        run: ./scripts/prepare-fengyin-audio-driver.ps1 -OutputDirectory "$env:RUNNER_TEMP/fengyin-driver-source"

      - name: 恢复微软 WDK NuGet 工具链
        shell: pwsh
        run: nuget restore "$env:RUNNER_TEMP/fengyin-driver-source/packages.config" -PackagesDirectory "$env:RUNNER_TEMP/fengyin-driver-source/packages"

      - name: 编译 x64 Release 驱动
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "未找到 Visual Studio Installer 的 vswhere.exe"
          }

          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild/**/Bin/MSBuild.exe | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw "未找到可用的 MSBuild.exe"
          }

          # The GitHub image contains the kernel MSBuild toolset, while the
          # pinned WDK package supplies host tools such as stampinf.exe. NuGet
          # does not add that private tools folder to PATH for packages.config
          # projects, so resolve it explicitly instead of relying on runner
          # image-specific global WDK installation state.
          $stampInf = Get-ChildItem "$env:RUNNER_TEMP/fengyin-driver-source/packages" `
            -Filter stampinf.exe -Recurse -File |
            Where-Object {
              $_.FullName -match 'Microsoft\.Windows\.WDK\.x64' -and
              $_.FullName -match '[\\/]x64[\\/]stampinf\.exe$'
            } |
            Select-Object -First 1
          if (-not $stampInf) {
            throw "WDK NuGet 包中未找到 x64/stampinf.exe"
          }
          $env:PATH = "$($stampInf.Directory.FullName);$env:PATH"

          $infVerif = Get-ChildItem "$env:RUNNER_TEMP/fengyin-driver-source/packages" `
            -Filter infverif.dll -Recurse -File |
            Where-Object {
              $_.FullName -match 'Microsoft\.Windows\.WDK\.x64' -and
              $_.FullName -match '[\\/]x64[\\/]infverif\.dll$'
            } |
            Select-Object -First 1
          if (-not $infVerif) {
            throw "WDK NuGet 包中未找到 x64/infverif.dll"
          }
          $env:PATH = "$($infVerif.Directory.FullName);$env:PATH"

          # Microsoft.Windows.WDK.x64 10.0.28000 ships ApiValidator only in
          # c/bin/.../x64, while its own WindowsDriver.common.targets still
          # resolves the host tool from c/bin/.../x86. Mirror the x64 host
          # executable into that expected private directory. This keeps the
          # Universal API validation enabled instead of hiding the packaging
          # defect with a skip flag.
          $apiValidator = Get-ChildItem "$env:RUNNER_TEMP/fengyin-driver-source/packages" `
            -Filter apivalidator.exe -Recurse -File |
            Where-Object {
              $_.FullName -match 'Microsoft\.Windows\.WDK\.x64' -and
              $_.FullName -match '[\\/]x64[\\/]apivalidator\.exe$'
            } |
            Select-Object -First 1
          if (-not $apiValidator) {
            throw "WDK NuGet 包中未找到 x64/apivalidator.exe"
          }
          $apiValidatorDll = Join-Path $apiValidator.Directory.FullName "microsoft.kits.drivers.apivalidator.dll"
          if (-not (Test-Path $apiValidatorDll)) {
            throw "WDK NuGet 包中未找到 ApiValidator 运行库"
          }
          $apiValidatorX86Dir = Join-Path $apiValidator.Directory.Parent.FullName "x86"
          New-Item -ItemType Directory -Force -Path $apiValidatorX86Dir | Out-Null
          # ApiValidator launches ApiExtractor from the same host-tools
          # directory. Mirror the complete directory, not only the front-end.
          Copy-Item (Join-Path $apiValidator.Directory.FullName "*") $apiValidatorX86Dir -Recurse -Force

          & $msbuild "$env:RUNNER_TEMP/fengyin-driver-source/audio/sysvad/EndpointsCommon/EndpointsCommon.vcxproj" `
            -restore `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:TreatWarningAsError=false `
            -m
          if ($LASTEXITCODE -ne 0) {
            throw "EndpointsCommon 编译失败：$LASTEXITCODE"
          }

          & $msbuild "$env:RUNNER_TEMP/fengyin-driver-source/audio/sysvad/TabletAudioSample/TabletAudioSample.vcxproj" `
            -restore `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:TreatWarningAsError=false `
            -p:SkipPackageVerification=true `
            -m
          if ($LASTEXITCODE -ne 0) {
            throw "风吟虚拟音频驱动编译失败：$LASTEXITCODE"
          }

          $builtInf = "$env:RUNNER_TEMP/fengyin-driver-source/audio/sysvad/TabletAudioSample/x64/Release/FengYinAudio.inf"
          if (-not (Test-Path $builtInf)) {
            throw "驱动已编译但未生成 FengYinAudio.inf"
          }
          $releaseDir = Split-Path -Parent $builtInf
          $builtCat = Join-Path $releaseDir "FengYinAudio.cat"
          if (-not (Test-Path $builtCat)) {
            # Inf2Cat is a host tool. Depending on the WDK release it may be
            # shipped only as x86 even when producing an x64 driver, so do not
            # confuse host architecture with the target package architecture.
            $inf2Cat = Get-ChildItem "$env:RUNNER_TEMP/fengyin-driver-source/packages" `
              -Filter inf2cat.exe -Recurse -File |
              Where-Object { $_.FullName -match 'Microsoft\.Windows\.WDK' } |
              Select-Object -First 1
            if (-not $inf2Cat) {
              $inf2Cat = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" `
                -Filter inf2cat.exe -Recurse -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1
            }
            if (-not $inf2Cat) {
              throw "WDK NuGet 包中未找到 x64/inf2cat.exe"
            }
            & $inf2Cat.FullName "/driver:$releaseDir" /os:10_X64 /uselocaltime
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $builtCat)) {
              throw "Inf2Cat 未能生成 FengYinAudio.cat：$LASTEXITCODE"
            }
          }
          $infVerifier = Get-ChildItem "$env:RUNNER_TEMP/fengyin-driver-source/packages" `
            -Filter infverif.exe -Recurse -File |
            Where-Object {
              $_.FullName -match 'Microsoft\.Windows\.WDK\.x64' -and
              $_.FullName -match '[\\/]x64[\\/]infverif\.exe$'
            } |
            Select-Object -First 1
          if (-not $infVerifier) {
            throw "WDK NuGet 包中未找到 x64/infverif.exe"
          }
          & $infVerifier.FullName /w $builtInf
          if ($LASTEXITCODE -ne 0) {
            throw "FengYinAudio.inf 验证失败：$LASTEXITCODE"
          }

          # MSBuild test-signs the SYS before this workflow regenerates the
          # catalog.  A newly generated CAT is unsigned and Windows will still
          # reject the package even when TESTSIGNING is enabled.  Sign the CAT
          # with exactly the same ephemeral WDK test certificate as the SYS.
          $sysPath = Join-Path $releaseDir "TabletAudioSample.sys"
          $sysSignature = Get-AuthenticodeSignature $sysPath
          if (-not $sysSignature.SignerCertificate -or
              $sysSignature.Status -notin @('Valid', 'UnknownError', 'NotTrusted')) {
            throw "TabletAudioSample.sys 没有可验证的 WDK 测试签名：$($sysSignature.Status)"
          }
          $testThumbprint = $sysSignature.SignerCertificate.Thumbprint
          if ($sysSignature.SignerCertificate.Subject -notmatch 'WDKTestCert|Windows Test|Test Certificate') {
            throw "内部测试驱动的 SYS 不是预期的 WDK 测试证书：$($sysSignature.SignerCertificate.Subject)"
          }
          $signTool = Get-ChildItem "$env:RUNNER_TEMP/fengyin-driver-source/packages" `
            -Filter signtool.exe -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool\.exe$' } |
            Select-Object -First 1
          if (-not $signTool) {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" `
              -Filter signtool.exe -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $signTool) { throw "未找到 x64 signtool.exe，无法签署测试 CAT。" }
          & $signTool.FullName sign /fd sha256 /sha1 $testThumbprint $builtCat
          if ($LASTEXITCODE -ne 0) { throw "FengYinAudio.cat 测试签名失败：$LASTEXITCODE" }
          # Do not import this ephemeral certificate into the hosted runner:
          # Windows may perform a long online chain lookup for a deliberately
          # self-signed WDK certificate.  The offline validator requires CAT
          # and SYS to carry the exact certificate exported by this build.
          # The target-PC installer performs the stricter Valid check after
          # importing that certificate into its local trust stores.
          ./scripts/test-fengyin-test-driver.ps1 -DriverDir $releaseDir

      - name: 生成 Partner Center 待签名提交包
        shell: pwsh
        run: |
          ./scripts/prepare-driver-submission.ps1 `
            -BuildOutputDir "$env:RUNNER_TEMP/fengyin-driver-source/audio/sysvad/TabletAudioSample/x64/Release" `
            -OutputDirectory "$env:RUNNER_TEMP/fengyin-driver-submission"

      - name: 上传内部编译产物
        uses: actions/upload-artifact@v4
        with:
          name: fengyin-audio-driver-test-signed-internal
          path: |
            ${{ runner.temp }}/fengyin-driver-source/audio/sysvad/TabletAudioSample/x64/Release/FengYinAudio.inf
            ${{ runner.temp }}/fengyin-driver-source/audio/sysvad/TabletAudioSample/x64/Release/FengYinAudio.cat
            ${{ runner.temp }}/fengyin-driver-source/audio/sysvad/TabletAudioSample/x64/Release/TabletAudioSample.sys
            ${{ runner.temp }}/fengyin-driver-source/audio/sysvad/TabletAudioSample/x64/Release/TabletAudioSample.cer
            ${{ runner.temp }}/fengyin-driver-source/audio/sysvad/TabletAudioSample/x64/Release/TabletAudioSample.pdb
          if-no-files-found: error

      - name: 上传 Partner Center 待签名 CAB
        uses: actions/upload-artifact@v4
        with:
          name: fengyin-audio-driver-partner-center-submission-unsigned
          path: ${{ runner.temp }}/fengyin-driver-submission/Disk1/FengYinAudio-attestation.cab
          if-no-files-found: error

  build-engineering-test-kit:
    name: 免费音频引擎实机测试包
    needs: build-driver
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: 获取风吟源码
        uses: actions/checkout@v5

      - name: 下载 WDK 测试签名驱动
        uses: actions/download-artifact@v5
        with:
          name: fengyin-audio-driver-test-signed-internal
          path: ${{ runner.temp }}/fengyin-test-driver

      - name: 安装中文安装包工具
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: 编译、测试并整理免安装程序
        shell: powershell
        run: ./scripts/build-windows.ps1 -Version "1.1.0-test" -SkipInstaller

      - name: 生成与正式版隔离的测试包
        shell: pwsh
        run: |
          ./scripts/package-audio-engine-test-kit.ps1 `
            -AppPackageDir "dist/FengYin" `
            -DriverDir "$env:RUNNER_TEMP/fengyin-test-driver" `
            -OutputDir "dist/FengYin-Audio-Engine-Test-Kit"

      - name: 上传免费实机测试包
        uses: actions/upload-artifact@v5
        with:
          name: 风吟-音频引擎-测试签名专用包
          path: dist/FengYin-Audio-Engine-Test-Kit
          if-no-files-found: error
          retention-days: 7
