name: Windows 编译与安装包
run-name: ${{ inputs.diagnostic_only && 'Windows diagnostic collectors only' || inputs.media_runtime_test && 'Windows media performance runtime (no installer)' || inputs.vlc_webview_test && 'Windows VLC WebView interaction diagnostic' || inputs.media_integration_test && 'Windows media integration diagnostic' || inputs.native_window_test && 'Windows native input diagnostic' || 'Windows build and installer' }}

on:
  workflow_dispatch:
    inputs:
      media_runtime_test:
        description: Build matching application and audio helpers only, no installers or driver changes
        type: boolean
        default: false
      vlc_webview_test:
        description: Exercise real WebView2 and VLC native-window input together
        type: boolean
        default: false
      media_integration_test:
        description: Test both media backends and VLC without building the application
        type: boolean
        default: false
      native_window_test:
        description: Run only native title mouse/touch desktop checks
        type: boolean
        default: false
      kong_test:
        description: Build independent Qin sustained-note technique test only
        type: boolean
        default: false
      startup_comparison:
        description: Build standalone ASIO startup comparison only
        type: boolean
        default: false
      diagnostic_only:
        description: Validate and package crash collector only (no engine, installer or drivers)
        type: boolean
        default: false
      vbcable_trial:
        description: Package opt-in VB-CABLE portable trial
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  media-runtime-test:
    if: ${{ inputs.media_runtime_test }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Restore verified media dependencies
        id: runtime-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/vlc
            third_party/ffmpeg-check
            third_party/nuget-packages
            build-vlc-webview/_deps/juce-src
          key: win2022-video-deps-juce902-webview1348544-${{ hashFiles('scripts/prepare_vlc.py', 'scripts/prepare_ffmpeg.py') }}
      - name: Prepare dependencies and parse development scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach ($file in @('scripts/test-video-fast.ps1','scripts/build-media-runtime.ps1','scripts/media-runtime-test/Run.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){throw ($errors | Out-String)}
          }
          if ('${{ steps.runtime-deps.outputs.cache-hit }}' -ne 'true') {
            python scripts/prepare_vlc.py third_party/vlc
            if($LASTEXITCODE){exit $LASTEXITCODE}
            nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory third_party/nuget-packages -NonInteractive
            if($LASTEXITCODE){exit $LASTEXITCODE}
          }
      - name: Build application and matching helpers, not installers
        shell: powershell
        run: |
          if (Test-Path build-vlc-webview/_deps/juce-src/CMakeLists.txt) {
            ./scripts/build-media-runtime.ps1 -JuceSource build-vlc-webview/_deps/juce-src
          } else {
            ./scripts/build-media-runtime.ps1
          }
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: FengYin-media-development-runtime
          path: dist/media-runtime-*/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: Media-runtime-build-failure-evidence
          path: |
            build-media-runtime/CMakeCache.txt
            build-media-runtime/CMakeFiles/CMakeConfigureLog.yaml
            build-media-runtime/*selftest*
          if-no-files-found: warn
  vlc-webview-test:
    if: ${{ inputs.vlc_webview_test }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Restore pinned diagnostic dependencies
        id: video-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/vlc
            third_party/ffmpeg-check
            third_party/nuget-packages
            build-vlc-webview/_deps/juce-src
          key: win2022-video-deps-juce902-webview1348544-${{ hashFiles('scripts/prepare_vlc.py', 'scripts/prepare_ffmpeg.py') }}
      - name: Prepare real VLC and WebView2 diagnostic
        shell: powershell
        run: |
          $env:PYTHONUTF8='1'
          if ('${{ steps.video-deps.outputs.cache-hit }}' -ne 'true') {
            python scripts/prepare_vlc.py third_party/vlc
            if($LASTEXITCODE){exit $LASTEXITCODE}
            python scripts/prepare_ffmpeg.py third_party/ffmpeg-check
            if($LASTEXITCODE){exit $LASTEXITCODE}
            nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory third_party/nuget-packages -NonInteractive
            if($LASTEXITCODE){exit $LASTEXITCODE}
          }
          & scripts/ensure_ci_webview.ps1
          cmake -S tools/vlc-webview-check -B build-vlc-webview -G "Visual Studio 17 2022" -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$pwd/third_party/nuget-packages"
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cmake --build build-vlc-webview --config Release --parallel 4
          if($LASTEXITCODE){exit $LASTEXITCODE}
          if (-not (Test-Path build-vlc-webview/Release/components/VLC/libvlc.dll)) { throw 'Private VLC runtime staging failed' }
          & third_party/ffmpeg-check/ffmpeg.exe -hide_banner -loglevel error -nostdin -y -f lavfi -i "color=c=red:s=1280x720:r=24" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 30 -c:v mpeg4 -q:v 3 -c:a aac -ac 2 build-vlc-webview/fixture.mp4
          exit $LASTEXITCODE
      - name: Save pinned dependencies before diagnostic execution
        if: steps.video-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/vlc
            third_party/ffmpeg-check
            third_party/nuget-packages
            build-vlc-webview/_deps/juce-src
          key: ${{ steps.video-deps.outputs.cache-primary-key }}
      - name: Compare callback-inline and deferred HWND operations
        id: default-interaction
        shell: powershell
        run: |
          $env:PYTHONUTF8='1'
          python scripts/check_vlc_webview.py build-vlc-webview build-vlc-webview/fixture.mp4
          exit $LASTEXITCODE
      - name: Isolate WebView renderer only after default interaction fails
        if: always() && steps.default-interaction.outcome == 'failure'
        shell: powershell
        run: |
          $previous = $env:FENGYIN_DIAGNOSTIC_WEBVIEW_ARGS
          try {
            python scripts/check_vlc_webview.py build-vlc-webview build-vlc-webview/fixture.mp4 --control-without-native-video --label no-native-video-control
            foreach ($variant in @(
              @{name='software-web-ui';args='--disable-gpu'},
              @{name='no-native-occlusion';args='--disable-features=CalculateNativeWinOcclusion'},
              @{name='no-web-gpu-compositing';args='--disable-gpu-compositing'})) {
              $env:FENGYIN_DIAGNOSTIC_WEBVIEW_ARGS = $variant.args
              python scripts/check_vlc_webview.py build-vlc-webview build-vlc-webview/fixture.mp4 --production-only --label $variant.name
              Write-Host ($variant.name + ' comparison exit=' + $LASTEXITCODE)
            }
          } finally { $env:FENGYIN_DIAGNOSTIC_WEBVIEW_ARGS = $previous }
          # Comparisons preserve the original default-step failure; no release bypass.
          exit 0
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: VLC-WebView-native-interaction-evidence
          path: |
            build-vlc-webview/evidence/
            build-vlc-webview/Release/*.pdb
            ci-webview-runtime.json
          if-no-files-found: warn
  media-integration-test:
    if: ${{ inputs.media_integration_test }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Prepare verified dependencies and build only media components
        shell: powershell
        run: |
          $env:PYTHONUTF8='1'
          python scripts/prepare_recording.py third_party/recording
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/prepare_vlc.py third_party/vlc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/prepare_ffmpeg.py third_party/ffmpeg-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S tools/media-integration-check -B build-media-check -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-media-check --config Release --parallel 4
          exit $LASTEXITCODE
      - name: Collect all media encoding, decoding and playback evidence
        shell: powershell
        run: |
          $env:PYTHONUTF8='1'
          python scripts/check_media_integration.py build-media-check third_party/ffmpeg-check third_party/vlc
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Windows-media-integration-evidence
          path: build-media-check/evidence/
          if-no-files-found: warn
  native-window-test:
    if: ${{ inputs.native_window_test }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Build only the native window input test
        shell: powershell
        run: |
          cmake -S tools/window-input-check -B build-window-input -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-window-input --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-window-input -C Release -V --output-on-failure
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-window-input-logs
          path: build-window-input/Testing/Temporary/*.log
          if-no-files-found: warn
  kong-test:
    if: ${{ inputs.kong_test }}
    uses: ./.github/workflows/kong-technique-test.yml
  startup-comparison:
    if: ${{ inputs.startup_comparison }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Build standalone comparison
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/asio-startup-comparison/Run.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){throw ($errors|Out-String)}
          cmake -S tools/asio-startup-comparison -B build-comparison -G "Visual Studio 17 2022" -A x64
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cmake -DJUCE_SOURCE_DIR="$pwd/build-comparison/_deps/juce-src" -P scripts/patch-juce-wasapi-raw.cmake
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cmake --build build-comparison --config Release --parallel 4
          if($LASTEXITCODE){exit $LASTEXITCODE}
          New-Item -ItemType Directory -Path comparison -Force | Out-Null
          Copy-Item build-comparison/Release/FengYinAsioComparison.exe comparison/
          Copy-Item tools/asio-startup-comparison/Start.cmd,tools/asio-startup-comparison/Run.ps1 comparison/
          Copy-Item tools/asio-startup-comparison/*.txt comparison/ -Exclude CMakeLists.txt
          Get-FileHash comparison/FengYinAsioComparison.exe | Format-List | Out-File comparison/SHA256.txt
      - uses: actions/upload-artifact@v5
        with:
          name: FengYin-ASIO-Startup-Comparison
          path: comparison/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: FengYin-ASIO-Startup-Symbols
          path: build-comparison/Release/*.pdb
          if-no-files-found: error
  audio-diagnostic:
    if: ${{ inputs.diagnostic_only }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Validate native window snapshots and actual CPU ETW collector
        shell: powershell
        run: |
          python -B -m unittest discover -s tests -p test_video_stall_capture.py
          if($LASTEXITCODE){exit $LASTEXITCODE}
          ./scripts/video-stall-capture/Test.ps1
      - name: Package validated video stall collector
        if: success()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path collector-package | Out-Null
          foreach($name in @('Capture.ps1','Start.cmd','WindowSnapshot.cs','NativeCommands.ps1')) {
            Copy-Item -LiteralPath (Join-Path 'scripts/video-stall-capture' $name) -Destination collector-package/
          }
          Get-ChildItem scripts/video-stall-capture -Filter *.txt | Copy-Item -Destination collector-package/
          Compress-Archive -Path collector-package/* -DestinationPath FengYin-Video-Stall-Capture.zip
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: FengYin-Video-Stall-Capture
          path: FengYin-Video-Stall-Capture.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Collector-smoke-evidence
          path: |
            window-smoke.json
            collector-smoke.zip
            collector-exact-entry.zip
            native-command-smoke/
            exact entry output (4)/
          if-no-files-found: ignore
      - name: Validate and package crash collector
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/audio-crash-capture/Capture.ps1','scripts/read-only-audio-diagnostics/Collect-Audio.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          New-Item -ItemType Directory -Path diagnostic/collector -Force | Out-Null
          Copy-Item scripts/audio-crash-capture/* diagnostic/collector/
          Copy-Item scripts/read-only-audio-diagnostics diagnostic/collector/read-only -Recurse
          Compress-Archive -Path diagnostic/collector/* -DestinationPath diagnostic/FengYin-Crash-Capture.zip
      - uses: actions/upload-artifact@v5
        with:
          name: FengYin-Crash-Capture
          path: diagnostic/FengYin-Crash-Capture.zip
  windows-release:
    if: ${{ !inputs.media_runtime_test && !inputs.vlc_webview_test && !inputs.media_integration_test && !inputs.diagnostic_only && !inputs.startup_comparison && !inputs.kong_test && !inputs.native_window_test }}
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: 获取源代码
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: 安装中文安装包工具
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: 验证 Fresh Air 全新安装
        shell: powershell
        run: ./scripts/test-fresh-air-install.ps1

      - name: 验证 magic.CURVE 全新安装
        shell: powershell
        run: ./scripts/test-magic-curve-install.ps1

      - name: 保存 magic.CURVE 安装验证日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: magic-CURVE-install-test
          path: magic-curve-install-test/

      - name: 实际执行安装末尾时间标记表达式
        shell: powershell
        run: ./scripts/test-installer-marker.ps1

      - name: 保存 Fresh Air 安装验证日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Fresh-Air-install-test
          path: fresh-air-install-test/
          if-no-files-found: ignore
          retention-days: 14

      - name: 编译、测试并生成安装包
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-windows.ps1

      - name: 保存自动测试结果
        if: always()
        shell: powershell
        run: |
          if (Test-Path build-windows/Testing) {
            Compress-Archive -Path build-windows/Testing -DestinationPath windows-test-results.zip -Force
          }
      - name: 保存真实VLC和WebView2联合输入证据
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Windows-VLC-WebView-interaction-evidence
          path: build-windows/evidence/
          if-no-files-found: warn

      - name: 准备 VB-CABLE 可选测试入口
        if: inputs.vbcable_trial == true
        shell: powershell
        run: |
          Copy-Item scripts/vbcable-trial/Start-VBCable-Test.cmd dist/FengYin/
          Copy-Item scripts/vbcable-trial/README.txt dist/FengYin/VB-CABLE-README.txt

      - name: 上传 VB-CABLE 免安装测试版
        if: inputs.vbcable_trial == true
        uses: actions/upload-artifact@v5
        with:
          name: FengYin-VBCABLE-Trial
          path: dist/FengYin/
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Windows 安装包
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: 风吟-Windows-x64-安装包
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 保存匹配的实机性能复核组件
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: FengYin-performance-runtime
          path: |
            dist/FengYin/FengYin.exe
            dist/FengYin/FengYinRecorder.exe
            dist/FengYin/components/Recording/
            dist/FengYin/components/VLC/
          if-no-files-found: error
          retention-days: 7

      - name: 上传失败诊断资料
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: Windows-失败诊断资料
          path: |
            build-windows/CMakeCache.txt
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
            windows-test-results.zip
            build-windows/*selftest*.error.txt
            build-windows/*selftest*.mp4
            build-windows/*selftest*.wav
          if-no-files-found: ignore
          retention-days: 7
