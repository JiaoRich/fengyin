name: Audio and MIDI recovery regression
on:
  push:
    branches: ['codex/audio-midi-recovery-20261122']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-regression:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Configure production sources and pinned JUCE
        shell: pwsh
        run: |
          cmake -S . -B build-recovery -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake -DJUCE_SOURCE_DIR="$pwd/build-recovery/_deps/juce-src" -P scripts/patch-juce-wasapi-raw.cmake
          if ($LASTEXITCODE) { throw 'Repeated patch failed' }
      - name: Compile Windows WASAPI and production MIDI paths
        shell: pwsh
        run: |
          cmake --build build-recovery --config Release --parallel 4 --target FengYinDjHostTests FengYinMidiOnsetTests FengYinAudioSetupRetentionTests FengYinBluetoothMidiTests FengYinBleMidiDecoderTests FengYinRealtimeMidiQueueTests FengYinPerformanceResetTests FengYinRecordingTests FengYinVoicePromptTests FengYinMasterOutputGuardTests FengYinKongDualSlotTests FengYinIntelligentTechniqueTests FengYinBreathSensitivityTests
          if ($LASTEXITCODE) { throw 'Compile failed' }
      - name: Execute targeted regressions
        shell: pwsh
        run: |
          ctest --test-dir build-recovery -C Release --output-on-failure -R 'kong_dual|wav_recording|ble_midi|bluetooth_|realtime_midi|midi_phrase|intelligent_technique|audio_setup|dj_production|breath_sensitivity|offline_voice|master_output|performance_reset'
          if ($LASTEXITCODE) { throw 'Regression failed' }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Audio-MIDI-recovery-regression
          path: build-recovery/Testing/Temporary/*.log
          retention-days: 7
